plugins {
    //d 'com.android.library'
    //id 'org.jetbrains.kotlin.android'
    alias libs.plugins.android.library
    alias libs.plugins.kotlin.android
    alias libs.plugins.spotless
    alias libs.plugins.detekt
}

detekt {
    buildUponDefaultConfig = true
    config.setFrom(rootProject.files('config/detekt/detekt.yml'))
    baseline = file('detekt-baseline.xml')
    parallel = true
}

spotless {
    kotlin {
        target 'src/**/*.kt'
        ktlint(libs.versions.ktlint.get()).editorConfigOverride([
                // 行宽写在 override 里(而非只靠磁盘 .editorconfig):spotless 的 up-to-date 检查不感知磁盘 .editorconfig 变化,写进构建脚本才进任务输入
                'max_line_length': '140',
                // 不可自动修复且属项目既有风格/交由 detekt(带 baseline)把关的规则
                'ktlint_standard_max-line-length': 'disabled',
                'ktlint_standard_no-wildcard-imports': 'disabled',
                'ktlint_standard_property-naming': 'disabled',
                'ktlint_standard_package-name': 'disabled',
        ])
    }
}

android {
    compileSdk = compile_sdk_version
    namespace 'com.script'
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }
    defaultConfig {
        minSdk 21
        targetSdk 35

        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkDependencies true
        lintConfig rootProject.file('lint.xml')
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

dependencies {
//    api(fileTree(dir: 'lib', include: ['rhino-1.7.14.jar']))
    api libs.mozilla.rhino

    implementation(libs.kotlinx.coroutines.core)
    implementation(libs.okhttp)
    implementation(libs.androidx.collection)

//    def coroutines_version = '1.7.3'
//    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutines_version")
}