<html lang="zh-CN"><head><meta charset="utf-8">

<title>本地小说阅读器 - 暗色模式</title><style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:"Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;justify-content:center}
.phone{width:min(100vw,412px);min-height:100vh;position:relative;overflow:hidden}
.status{height:34px;display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0;font-size:14px;font-weight:600}
.status-right{display:flex;gap:10px;align-items:center}.main{padding:10px 16px 112px}
.header{height:62px;display:flex;align-items:center;justify-content:space-between}
.title{font-size:29px;font-weight:650}.actions{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:22px;display:grid;place-items:center;cursor:pointer}
.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.controls{display:flex;align-items:center;justify-content:space-between;margin:4px 0 24px}
.tabs{display:flex;height:48px;border-radius:24px;overflow:hidden}.tab{min-width:88px;padding:0 22px;border:0;font-size:16px;font-weight:600;cursor:pointer}
.sort{border:0;background:transparent;font-size:15px;display:flex;gap:8px;align-items:center;cursor:pointer}
.feature{border-radius:19px;padding:20px;display:grid;grid-template-columns:112px 1fr;gap:18px;position:relative;overflow:hidden}
.feature-cover{width:112px;height:152px;object-fit:cover;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.14)}
.feature-info{min-width:0;padding-right:34px}.kicker{display:flex;align-items:center;gap:9px;font-size:15px;margin-bottom:8px}
.kicker-bar{width:4px;height:24px;border-radius:3px}.book-title{font-size:24px;font-weight:700;line-height:1.25;margin-bottom:8px}
.meta{display:flex;align-items:center;gap:9px;font-size:15px;line-height:1.8}.mini{width:19px;height:19px;flex:none}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:11px}.progress{height:6px;border-radius:4px;flex:1;overflow:hidden}
.progress>span{display:block;height:100%;width:68%;border-radius:4px}.percent{font-size:14px;min-width:34px}
.go{position:absolute;right:16px;top:34px;width:50px;height:50px;border:0;border-radius:50%;display:grid;place-items:center}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:32px 8px 14px}
.section-title{font-size:23px;font-weight:700}.count{font-size:15px}
.book-row{display:grid;grid-template-columns:88px 1fr 32px;gap:16px;padding:16px 8px;min-height:160px}
.row-cover{width:88px;height:124px;object-fit:cover;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
.row-info{padding-top:2px;min-width:0}.row-title{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-meta{display:flex;align-items:center;gap:9px;font-size:15px;line-height:1.9}.more{display:grid;place-items:start center;padding-top:2px}
.divider{height:1px;margin-left:8px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100vw,412px);height:82px;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;padding:5px 10px 9px;z-index:5;backdrop-filter:blur(12px)}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;border-radius:20px;font-size:14px}.nav.active{width:64px;justify-self:center}
.navicon{width:25px;height:25px}.home-indicator{position:absolute;left:50%;bottom:5px;transform:translateX(-50%);width:104px;height:4px;border-radius:3px}
:root{--bg:#141312;--surface:#1d1b19;--surface2:#242220;--text:#f3f0eb;--secondary:#b4b0aa;--primary:#ff6b2c;--primary-soft:#3a241b;--track:#353331;--divider:rgba(255,255,255,.08)}
body{background:var(--bg);color:var(--text)}.tabs{background:var(--surface2)}.tab{background:transparent;color:var(--secondary)}.tab.active{background:var(--primary);color:white}.sort{color:var(--secondary)}.feature{background:var(--surface);border:1px solid var(--divider)}.kicker,.meta,.row-meta,.count{color:var(--secondary)}.kicker-bar,.progress>span{background:var(--primary)}.go{background:rgba(255,255,255,.08);color:var(--text)}.progress{background:var(--track)}.divider{background:var(--divider)}.bottom{background:rgba(29,27,25,.94);border-top:1px solid var(--divider)}.nav{color:var(--secondary)}.nav.active{background:var(--primary-soft);color:var(--primary)}.home-indicator{background:#f3f0eb}
</style></head>
